name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect the checked-in HTML exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          cp index.html .nojekyll _site/
          count=0
          for source in *.muweave; do
            item="${source%.muweave}"
            [[ "$item" =~ ^[1-9][0-9]*$ ]] || continue
            test -s "$item/index.html"
            mkdir "_site/$item"
            cp "$item/index.html" "_site/$item/index.html"
            count=$((count + 1))
          done
          test "$count" -gt 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
